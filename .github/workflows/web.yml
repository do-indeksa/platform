name: web

on:
  pull_request:
    paths:
      - apps/web/**
      - content/**
      - tools/content/**
      - apps/api/api/openapi.yaml
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - content/**
      - tools/content/**
      - apps/api/api/openapi.yaml
      - .github/workflows/web.yml

defaults:
  run:
    working-directory: apps/web

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tools/content/package-lock.json
      - name: Install content pipeline
        working-directory: tools/content
        run: npm ci
      - name: Audit content dependencies
        working-directory: tools/content
        run: npm audit --omit=dev --audit-level=high
      - name: Check content pipeline formatting
        working-directory: tools/content
        run: npm run format:check
      - name: Test content pipeline
        working-directory: tools/content
        run: npm test
      - name: Audit content provenance
        working-directory: tools/content
        run: npm run check
      - name: Check immutable snapshot history
        working-directory: tools/content
        env:
          SNAPSHOT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:snapshot-history -- --base "$SNAPSHOT_BASE"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run generate:api && git diff --exit-code
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:visual
      - name: Upload browser test artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-browser-test-artifacts
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14
