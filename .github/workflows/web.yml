name: web

on:
  pull_request:
    paths:
      - apps/web/**
      - content/**
      - tools/content/**
      - apps/api/api/openapi.yaml
      - .github/workflows/web.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - content/**
      - tools/content/**
      - apps/api/api/openapi.yaml
      - .github/workflows/web.yml

defaults:
  run:
    working-directory: apps/web

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            tools/content/package-lock.json
      - name: Install content pipeline
        working-directory: tools/content
        run: npm ci
      - name: Audit content dependencies
        working-directory: tools/content
        run: npm audit --omit=dev --audit-level=high
      - name: Check content pipeline formatting
        working-directory: tools/content
        run: npm run format:check
      - name: Test content pipeline
        working-directory: tools/content
        run: npm test
      - name: Audit content provenance
        working-directory: tools/content
        run: npm run check
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run generate:api && git diff --exit-code
      - run: npx prettier --check .
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
